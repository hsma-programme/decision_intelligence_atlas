name: Validate Quarto categories

on:
  push:
  workflow_dispatch:

  jobs:
  validate-categories:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check categories
        run: python resources/scripts/check_categories.py