name: Generate Quarto page from Issue Form
on:
  issues:
    types: [edited, labeled]
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    if: |
      (github.event.action == 'labeled' &&
       github.event.label.name == 'project_package_tool_submission') ||
      (github.event.action == 'edited' &&
       contains(join(github.event.issue.labels.*.name, ','), 'project_package_tool_submission'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract issue data
        id: extract
        uses: issue-ops/parser@v4.2.0
        with:
          body: ${{ github.event.issue.body }}
          issue-form-template: 1-new_package_project_tool_submission.yml

      - name: Create QMD file
        id: generate
        env:
          # The issue text is passed in the environment, never pasted into the
          # script, so it can't run commands in this workflow.
          ISSUE_JSON: ${{ steps.extract.outputs.json }}
        run: python3 .github/scripts/generate_entry_from_issue.py

      - name: Commit and open PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add package, tool or project: ${{ fromJSON(steps.extract.outputs.json).model_name }}"
          branch: add-${{ steps.generate.outputs.folder }}
          title: "Add package, tool or project: ${{ fromJSON(steps.extract.outputs.json).model_name }}"
          body: |
            Auto-generated from issue #${{ github.event.issue.number }}.

            Before merging, check `${{ steps.generate.outputs.path }}`:
            - [ ] categories and languages are correct, and any suggested new categories (in a comment at the end of the file) are dealt with
            - [ ] an image has been added to the folder and an `image:` line added to the header, if one is available
            - [ ] author affiliations and ORCIDs added where known
            - [ ] the details render properly, including any images or videos
          reviewers: Bergam0t
      - name: Save PR URL to environment
        run: echo "PR_URL=${{ steps.create_pr.outputs.pull-request-url }}" >> $GITHUB_ENV
      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const prUrl = process.env.PR_URL;
            const body = `
            👋 Thanks for your submission!

            A pull request has been automatically opened: ${prUrl}

            A member of the review team will review it soon. 🚀
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
