name: Generate Quarto page from Issue Form
on:
  issues:
    types: [edited, labeled]
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    if: |
      (github.event.action == 'labeled' &&
       github.event.label.name == 'project_package_tool_submission') ||
      (github.event.action == 'edited' &&
       contains(join(github.event.issue.labels.*.name, ','), 'project_package_tool_submission'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract issue data
        id: extract
        uses: issue-ops/parser@v4.2.0
        with:
          body: ${{ github.event.issue.body }}
          issue-form-template: 1-new_package_project_tool_submission.yml

      - name: Set sanitized model name
        id: modelname
        run: |
          RAW_MODEL_NAME="${{ fromJSON(steps.extract.outputs.json).model_name }}"
          SAFE_MODEL_NAME=$(echo "$RAW_MODEL_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g; s/__*/_/g; s/^_*//; s/_*$//')
          echo "safe_model_name=$SAFE_MODEL_NAME" >> $GITHUB_OUTPUT

      - name: Process Categories
        id: categories
        env:
          JSON_PAYLOAD: ${{ steps.extract.outputs.json }}
        run: |
          {
            echo "list<<EOF"
            echo "$JSON_PAYLOAD" | jq -r '.category[]?' | sed 's/^/  - /'
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Process Languages
        id: languages
        env:
          JSON_PAYLOAD: ${{ steps.extract.outputs.json }}
        run: |
          # Get base languages
          LANG_LIST=$(echo "$JSON_PAYLOAD" | jq -r '.language[]?' | sed 's/^/  - /')

          # Handle language_other if it exists
          LANG_OTHER=$(echo "$JSON_PAYLOAD" | jq -r '.language_other // ""')
          if [ -n "$LANG_OTHER" ]; then
            IFS=';' read -ra ADDS <<< "$LANG_OTHER"
            for i in "${ADDS[@]}"; do
              CLEAN_I=$(echo "$i" | xargs)
              if [ -n "$CLEAN_I" ]; then
                # Append to the list with correct indentation
                LANG_LIST=$(printf "%s\n  - %s" "$LANG_LIST" "$CLEAN_I")
              fi
            done
          fi

          {
            echo "list<<EOF"
            echo "$LANG_LIST"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Get Status Span
        id: status
        env:
          JSON_PAYLOAD: ${{ steps.extract.outputs.json }}
        run: |
          SPAN=$(echo "$JSON_PAYLOAD" | jq -r '
            def colorize($s):
              if $s == "Bronze" then "<span style=\"color: #893400FF\">Bronze</span>"
              elif $s == "Silver" then "<span style=\"color: #888888FF\">Silver</span>"
              elif $s == "Gold" then "<span style=\"color: #D18B12FF\">Gold</span>"
              else "<span>" + ($s // "Unknown") + "</span>"
              end;
            .status | (if type=="array" then .[] else . end) | colorize(.)
          ')
          echo "status_span=$SPAN" >> $GITHUB_OUTPUT

      - name: Create QMD file
        env:
            # Pulling in all the work from previous steps
            CATS: ${{ steps.categories.outputs.categories }}
            LANGS: ${{ steps.languages.outputs.language }}
            STATUS: ${{ steps.status.outputs.status_span }}
            # Raw data for the blocks
            JSON_DATA: ${{ steps.extract.outputs.json }}
        run: |
          mkdir -p "packages_projects_tools/${{ steps.modelname.outputs.safe_model_name }}"
          cat > "packages_projects_tools/${{ steps.modelname.outputs.safe_model_name }}/index.qmd" <<EOF
          ---
          title: \"${{ fromJSON(env.JSON_DATA).model_name }}\"
          categories:
          ${{ env.CATS }}
          tool-language:
          ${{ env.LANGS }}
          author:
            - name: \"${{ fromJSON(env.JSON_DATA).author }}\"
              affiliation:
              orcid:
          status: ${{ env.STATUS }}
          toc: true
          image:
          pub-info:
            rationale-for-status: |
              \"${{ fromJSON(env.JSON_DATA).status_reason }}\"
            entry-author:
              - name: \"${{ fromJSON(env.JSON_DATA).entry_author }}\"
                url: \"${{ fromJSON(env.JSON_DATA).entry_author_url }}\"
            abstract: |
              \"${{ fromJSON(env.JSON_DATA).summary }}\"
            links:
            - name: Code
              url: \"${{ fromJSON(env.JSON_DATA).code }}\"
              icon: fa-brands fa-github
            - name: Documentation
              url: \"${{ fromJSON(env.JSON_DATA).documentation }}\"
              icon: fa-solid fa-book
            - name: Paper
              url: \"${{ fromJSON(env.JSON_DATA).paper }}\"
              icon: fa-solid fa-file-contract
            - name: PyPi
              url: \"${{ fromJSON(env.JSON_DATA).pypi }}\"
              icon: fa-solid fa-brands fa-python
            - name: CRAN
              url: \"${{ fromJSON(env.JSON_DATA).cran }}\"
              icon: fa-solid fa-brands fa-r-project
            - name: Website
              url: \"${{ fromJSON(env.JSON_DATA).website }}\"
              icon: fa-solid fa-globe
          ---

          ## Additional Links
          ${{ fromJSON(env.JSON_DATA).other_urls }}

          ## Additional Categories
          ${{ fromJSON(env.JSON_DATA).category_other }}

          ## Details
          ${{ fromJSON(env.JSON_DATA).details }}


          <br>

          ## Project status

          **Status: {{< meta status >}}**

          **Rationale:** \"${{ fromJSON(env.JSON_DATA).status_reason }}\"

          EOF
      - name: Commit and open PR
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add package, tool or project: ${{ fromJSON(steps.extract.outputs.json).model_name }}"
          branch: add-${{ steps.modelname.outputs.safe_model_name }}
          title: "Add package, tool or project: ${{ fromJSON(steps.extract.outputs.json).model_name }}"
          body: "Auto-generated from issue #${{ github.event.issue.number }}"
          reviewers: Bergam0t
      - name: Save PR URL to environment
        run: echo "PR_URL=${{ steps.create_pr.outputs.pull-request-url }}" >> $GITHUB_ENV
      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const prUrl = process.env.PR_URL;
            const body = `
            👋 Thanks for your submission!

            A pull request has been automatically opened: ${prUrl}

            A member of the review team will review it soon. 🚀
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body
            });
