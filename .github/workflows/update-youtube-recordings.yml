name: Update YouTube recordings

# Refreshes the recordings listed in resources/recordings/collections.yml,
# commits any changes, and republishes the site if anything changed.
# Needs the YOUTUBE_API_KEY repository secret, plus a GitHub App to push
# past the main branch ruleset: its ID as the RECORDINGS_APP_ID repository
# variable and its private key as the RECORDINGS_APP_PRIVATE_KEY repository
# secret. The app needs Contents read and write permission, must be installed
# on this repository and must be on the main ruleset's bypass list. If the
# repository moves to another organisation, see "If the repository moves to a
# different GitHub organisation" in the README.

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {} # manual trigger, e.g. after a conference

jobs:
  update-recordings:
    runs-on: ubuntu-latest
    permissions:
      contents: read # pushes use the app token, not GITHUB_TOKEN
      actions: write # trigger the publish workflow
    steps:
      # GITHUB_TOKEN can't bypass the rule that changes to main go through a
      # pull request, so push with a token from an app that can.
      - name: Get token that can push to main
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RECORDINGS_APP_ID }}
          private-key: ${{ secrets.RECORDINGS_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Fetch playlists from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python resources/scripts/fetch_youtube_playlists.py

      - name: Build tables of talks
        run: python resources/scripts/build_youtube_talks.py

      - name: Commit & push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only commit "last checked" dates on main, so that branches don't
          # conflict with main's weekly runs. New collections' files are kept,
          # as their pages need a date.
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            git restore -- ':(glob)**/_metadata.yml'
          fi
          git add books_training packages_projects_tools recordings
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(recordings): refresh YouTube recordings"
            git push
          fi

      # Rebuild the whole site after every run on main, even if nothing
      # changed. The files changed here (talks.yml, recordings.json and
      # _metadata.yml) aren't in the publish workflow's paths filter, so the
      # push doesn't trigger it; start it directly instead. Only for main, so
      # that running this workflow on another branch (e.g. to fetch a new
      # collection for a pull request) doesn't publish that branch.
      - name: Republish site
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${{ github.ref_name }}"
