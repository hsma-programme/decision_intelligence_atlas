on:
  workflow_dispatch:
  push:
    branches: main
    paths:
      - '_quarto.yml'
      - '**/*.qmd'
      - '.github/**/*.yml'

name: Quarto Publish

jobs:
  build-deploy:
    env:
      # fallback defaults; they can be overridden by workflow_dispatch inputs
      QMD_FILE: 'index.qmd'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: my-env
          environment-file: environment.yaml
          python-version: 3.12
          auto-activate-base: false

      - name: Update YAML date with last commit
        run: bash ./resources/update-quarto-date.sh

      - name: Determine issue counts
        id: get_counts
        run: |
          # Define your three label/placeholder pairs
          # Format: "LABEL|PLACEHOLDER"
          declare -a CONFIGS=(
            "SUGGESTION: new project package or tool|PROPOSED_PPT_ENTRY_COUNT"
            "SUGGESTION: new technique|PROPOSED_TECHNIQUE_ENTRY_COUNT"
            "SUGGESTION: new graph catalogue entry|PROPOSED_GRAPH_GALLERY_ENTRY_COUNT"
          )

          OWNER_REPO="${{ github.repository }}"

          # Use a temporary file to store results as JSON
          TEMP_FILE=$(mktemp)
          echo "[]" > "$TEMP_FILE"

          for CONFIG in "${CONFIGS[@]}"; do
            IFS='|' read -r LABEL PLACEHOLDER <<< "$CONFIG"
            echo "Fetching count for label: $LABEL"

            # Write a tiny Python script to a temp file
            ENCODE_SCRIPT=$(mktemp --suffix=.py)
            cat > "$ENCODE_SCRIPT" << 'PYEOF'
          import urllib.parse, os, sys
          label = sys.argv[1]
          repo = sys.argv[2]
          query = f'repo:{repo} label:"{label}" type:issue state:open'
          print(urllib.parse.quote(query))
          PYEOF

            # Call the script, passing args safely
            ENCODED_QUERY=$(python3 "$ENCODE_SCRIPT" "$LABEL" "$OWNER_REPO")
            rm "$ENCODE_SCRIPT"

          # Write response to a temp file instead of passing as argument
          RESPONSE_FILE=$(mktemp)
          curl -s -H "Authorization: ***" \
            -H "Accept: application/vnd.github+json" \
            -G "https://api.github.com/search/issues" \
            --data-urlencode "q=repo:${OWNER_REPO} label:\"${LABEL}\" type:issue state:open" > "$RESPONSE_FILE"

          # Now pass the filepath instead of the content
          python3 - <<'PY' "$RESPONSE_FILE" "$LABEL" "$PLACEHOLDER" "$TEMP_FILE"
          import sys, json
          from pathlib import Path
          response = json.loads(Path(sys.argv[1]).read_text())  # read file instead
          count = response.get("total_count", 0)
          label = sys.argv[2]
          placeholder = sys.argv[3]
          temp_file = sys.argv[4]

          # Read existing data
          data = json.loads(Path(temp_file).read_text())
          # Append new entry
          data.append({"label": label, "placeholder": placeholder, "count": count})
          # Write back
          Path(temp_file).write_text(json.dumps(data))

          print(f"Found {count} issues with label '{label}'")
          PY
          rm "$RESPONSE_FILE"
          done

          # Export JSON to GITHUB_OUTPUT
          DATA=$(cat "$TEMP_FILE")
          echo "data<<EOF" >> $GITHUB_OUTPUT
          echo "$DATA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          rm "$TEMP_FILE"

      - name: Replace placeholders in QMD
        run: |
          FILE="${{ env.QMD_FILE }}"
          DATA='${{ steps.get_counts.outputs.data }}'

          if [ ! -f "$FILE" ]; then
            echo "ERROR: file $FILE not found"
            exit 1
          fi

          # Replace all placeholders
          python3 - <<'PY' "$FILE" "$DATA"
          import json, sys
          from pathlib import Path

          file_path = Path(sys.argv[1])
          data = json.loads(sys.argv[2])

          text = file_path.read_text(encoding="utf-8")
          original_text = text

          for item in data:
              placeholder = item["placeholder"]
              count = item["count"]
              text = text.replace(placeholder, str(count))
              print(f"Replaced {placeholder} with {count}")

          if text == original_text:
              print("Warning: no placeholders found; file unchanged.")
          else:
              file_path.write_text(text, encoding="utf-8")
              print(f"Updated {file_path}")
          PY

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
