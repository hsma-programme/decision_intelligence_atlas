apha_recordings:
  folder: books_training/apha_recordings
  source: AphA
  playlists:
    - label: Webinars and workshops
      id: UUJVrw1kIEyQmb1khi1nQSNQ # all of AphA's uploads
      type: Webinar
      types_by_title:
        - pattern: conference
          type: Conference talk
        - pattern: workshop
          type: Workshop
      events_by_title:
        - pattern: 'lunch\s*(&|and)\s*learn|\bL&L\b'
          event: Lunch & Learn
        - pattern: conference
          event: AphA Conference
        - pattern: 'branch|hybrid event'
          event: Branch meetings
      # AphA's own admin sessions, e.g. on professional registration and mentoring
      exclude_by_title:
        - registration
        - introductory webinar
        - professional home
        - mentor
        - survey winners
      # Dates and "meeting recording", added to most titles
      remove_from_title: '\s*(\b\d{1,2}(st|nd|rd|th)?\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(\s*\d{2,4})?|\b\d{8}\s+\d{6}|\bmeeting\s+recording|\brecording)\b'
      # Introduction repeated in each 2020 conference session's description
      remove_from_description:
        - '^Association of Professional HealthCare Analyst \(AphA\) Annual Conference'
        - '^This video is from Session'

