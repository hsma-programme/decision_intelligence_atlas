# Collections of YouTube recordings shown on the Atlas.
#
# Each collection belongs to an Atlas entry (`folder`), where
# fetch_youtube_playlists.py writes its videos.json and build_youtube_talks.py
# writes its talks.yml. All collections are also combined into the
# Recordings Finder (recordings/index.qmd).
#
# For each collection:
#   source             - who published the recordings, shown in the Recordings Finder
#   playlists          - playlists to fetch, each with:
#       label          - name shown on the site, unique within the collection; a year
#                        in it (e.g. "RPySOC 2025")
#                        is used as the year of its videos, otherwise the publish
#                        date is used
#       id             - YouTube playlist ID, or a list of IDs to combine several
#                        playlists under one label. A channel's uploads can be
#                        fetched with its uploads playlist ID (its channel ID, with
#                        "UC" replaced by "UU")
#       videos         - optional, in place of `id`; a list of video IDs to include,
#                        e.g. to pick out a few videos from a larger playlist
#       type           - kind of recording, shown in the Recordings Finder
#       talk_list      - optional; true if session recordings list their talks one per
#                        line without timestamps (see build_youtube_talks.py)
#       no_year        - optional; true to leave the year blank, e.g. where videos were
#                        uploaded long after the event and the label has no year
#       types_by_title - optional; list of `pattern` (a regular expression) and `type`,
#                        giving the type of videos whose titles match the pattern,
#                        for playlists mixing different kinds of recording
#       title_from_description - optional; true to use the first line of each
#                        video's description as its title, for playlists whose video
#                        titles are cluttered or cut short
#   exclude_playlists  - optional; videos in these playlists are left out
#   exclude_videos     - optional; these videos are left out

